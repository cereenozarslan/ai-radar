<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-Radar — X Arama</title>
<style>
  :root {
    --bg: #eef0ea;
    --surface: #ffffff;
    --surface-2: #f5f6f1;
    --border: #d8dbd2;
    --text: #1c2024;
    --text-muted: #5b6168;
    --accent: #c97f1e;
    --danger: #b3402f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1417;
      --surface: #161d21;
      --surface-2: #1c2429;
      --border: #2a333a;
      --text: #eae7e0;
      --text-muted: #8b959c;
      --accent: #f2a541;
      --danger: #e07a63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }

  .mono {
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 4rem 1.5rem 4rem;
  }

  .eyebrow {
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 0.75rem;
  }
  .eyebrow::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    text-align: center;
    font-size: clamp(1.5rem, 3vw, 2rem);
    margin: 0 0 2rem;
    text-wrap: balance;
  }

  form.search {
    display: flex;
    gap: 0.5rem;
  }

  input[type="text"] {
    flex: 1;
    padding: 0.85rem 1.1rem;
    font-size: 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    padding: 0.85rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #1c1200;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.8rem;
  }

  .interpreted {
    display: none;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 1.5rem 0;
  }
  .chip {
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
  }

  .status { text-align: center; color: var(--text-muted); margin: 1.5rem 0; font-size: 0.9rem; }
  .status.error { color: var(--danger); }

  .results { display: flex; flex-direction: column; gap: 0.9rem; margin-top: 1.5rem; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
  }
  .item a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .item a:hover { text-decoration: underline; }
  .item .meta {
    margin-top: 0.35rem;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">AI-Radar · X arama</div>
  <h1>Ne öğrenmek istiyorsun?</h1>

  <form class="search" id="search-form">
    <input
      type="text"
      id="q"
      placeholder='örn. "Claude&#39;ın son gelişmesi hakkında etkileşimi yüksek son 24 saatteki tweetler"'
      autocomplete="off"
      autofocus
    />
    <button type="submit" id="submit-btn">Ara</button>
  </form>
  <p class="hint">Zaman aralığı ("son 24 saat") ve etkileşim ("yüksek etkileşim", "popüler") ifadelerini otomatik anlar. Her arama gerçek bir X API isteği gönderir.</p>

  <div class="interpreted" id="interpreted"></div>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</div>

<script>
  const form = document.getElementById("search-form");
  const input = document.getElementById("q");
  const submitBtn = document.getElementById("submit-btn");
  const interpretedEl = document.getElementById("interpreted");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  function fmtDate(iso) {
    if (!iso) return "tarih yok";
    try {
      return new Intl.DateTimeFormat("tr-TR", {
        day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit",
      }).format(new Date(iso));
    } catch (e) {
      return iso;
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Aranıyor…";
    interpretedEl.style.display = "none";
    resultsEl.innerHTML = "";
    statusEl.className = "status";
    statusEl.textContent = "Aranıyor, X'e gerçek bir istek gönderiliyor…";

    try {
      const resp = await fetch("/api/search?q=" + encodeURIComponent(q));
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.detail || "Bilinmeyen hata");
      }

      const p = data.interpreted;
      interpretedEl.innerHTML = `
        <span class="chip">konu: ${p.topic || "(genel AI/LLM)"}</span>
        <span class="chip">zaman: ${p.hours ? "son " + p.hours + " saat" : "sınırsız (son 7 gün)"}</span>
        <span class="chip">min. etkileşim: ${p.min_engagement}</span>
      `;
      interpretedEl.style.display = "flex";

      statusEl.textContent = `${data.result_count} sonuç bulundu, ${data.added_count} yeni kayıt veritabanına eklendi.`;

      resultsEl.innerHTML = data.items.map(it => `
        <div class="item">
          <a href="${it.url}" target="_blank" rel="noopener noreferrer">${it.title}</a>
          <div class="meta">${it.author ? "@" + it.author : "yazar yok"} · ${fmtDate(it.published_at)}</div>
        </div>
      `).join("") || `<p class="status">Bu kritere uyan sonuç bulunamadı.</p>`;

    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = "Hata: " + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Ara";
    }
  });
</script>
</body>
</html>
